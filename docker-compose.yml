services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # durable queue across restarts
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    volumes:
      - ./prompts:/app/prompts:ro   # edit prompts without rebuilding; restart to apply
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5

  worker:
    build: .
    env_file: .env
    volumes:
      - ./prompts:/app/prompts:ro
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 1   # scale with: docker compose up --scale worker=3

  # Dummy RAG / History / Result / Status APIs + mock LLM.
  # Remove this service once the real APIs exist and update the URLs in .env.
  mocks:
    build: .
    env_file: .env
    command: ["uvicorn", "mocks.app:app", "--host", "0.0.0.0", "--port", "9000"]
    ports:
      - "9000:9000"

volumes:
  redis-data:
